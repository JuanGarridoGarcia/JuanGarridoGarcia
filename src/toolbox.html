<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { --fg: #1f2328; --muted: #59636e; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f0f6fc; --muted: #9198a1; } }
  html, body { margin: 0; background: transparent; font-family: "Inter", sans-serif; }
  #toolbox { display: inline-flex; gap: 30px; padding: 6px 4px; }
  .t { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 92px; }
  .t img { width: 64px; height: 64px; }
  .t span { font-size: 16px; color: var(--muted); font-weight: 500; }
  .light-only { display: inline; } .dark-only { display: none; }
  @media (prefers-color-scheme: dark) { .light-only { display: none; } .dark-only { display: inline; } }
</style>
</head>
<body>
<div id="toolbox">
  <div class="t"><img class="light-only" src="icons/Python-Light.svg"><img class="dark-only" src="icons/Python-Dark.svg"><span>Python</span></div>
  <div class="t"><img class="light-only" src="icons/SciKitLearn-Light.svg"><img class="dark-only" src="icons/ScikitLearn-Dark.svg"><span>scikit-learn</span></div>
  <div class="t"><img class="light-only" src="icons/SQL-Light.svg"><img class="dark-only" src="icons/SQL-Dark.svg"><span>SQL</span></div>
  <div class="t"><img class="light-only" src="icons/Matlab-Light.svg"><img class="dark-only" src="icons/Matlab-Dark.svg"><span>MATLAB</span></div>
  <div class="t"><img class="light-only" src="icons/Java-Light.svg"><img class="dark-only" src="icons/Java-Dark.svg"><span>Java</span></div>
  <div class="t"><img src="icons/Git.svg"><span>Git</span></div>
  <div class="t"><img class="light-only" src="icons/Linux-Light.svg"><img class="dark-only" src="icons/Linux-Dark.svg"><span>Linux</span></div>
  <div class="t"><img class="light-only" src="icons/Bash-Light.svg"><img class="dark-only" src="icons/Bash-Dark.svg"><span>Bash</span></div>
</div>
</body>
</html>
